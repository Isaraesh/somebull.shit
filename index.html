</style></head><body><header><div><span class="eyebrow">TWO DRINKS</span><h1>Script editor</h1></div><div class="toolbar"><button data-action="import"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m-5 5 5-5 5 5M4 16v5h16v-5"/></svg> Import JSON</button><button data-action="portable">Save editor HTML</button><button data-action="js">Export story JS</button><button data-action="export" class="primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg> Export edits</button></div></header><div class="savebar"><span id="save-status">Current script loaded</span><span>Edits stay in this editor. Export them to update the game.</span></div><div class="layout"><aside><nav id="navigation" aria-label="Script sections"></nav><button class="validation-button" data-action="validate">Check script <span id="issue-count"></span></button></aside><main id="editor"></main></div><input id="import-file" type="file" accept=".json,application/json" hidden><dialog id="notice"><h2 id="notice-title"></h2><p id="notice-copy"></p><div class="dialog-actions"><button data-action="cancel-notice">Cancel</button><button id="notice-confirm" class="primary">Continue</button></div></dialog><dialog id="preview"><button class="icon-button close" data-action="close-preview" aria-label="Close preview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button><span class="eyebrow" id="preview-scene"></span><div id="preview-portraits"></div><span id="preview-speaker"></span><p id="preview-copy"></p><div class="preview-controls"><button data-action="prev-preview">Previous line</button><span id="preview-count"></span><button data-action="next-preview" class="primary">Next line</button></div></dialog><div id="toast" role="status"></div><script id="editor-seed" type="application/json">{"cast": {"vanessa": {"name": "Vanessa", "role": "Here to see Ella, obviously", "art": "vanessa", "color": "#965b70", "note": "Came in before the sign was even turned. Complains about my customer service while finding reasons to stay.", "aside": ["you can look at the cup, you know. i’ll still be here when you look back up.", "I was checking whether you were stealing the pearls. You are."], "miss": ["I got distracted. You can probably guess by what.", "You have officially exhausted my ability to blame the lighting.", "queen. i asked for a drink, not an act of sabotage. one more go?", true], "retry": "we will blame the machine and never speak of this again."}, "caprielle": {"name": "Caprielle", "role": "A sweet tooth and a kind heart", "art": "caprielle", "color": "#b36b85", "note": "Checks that I have had a drink before ordering hers. Kind without making me explain whether I need it.", "aside": ["Can I get you a glass of water while you do that? You’ve been making everyone else’s drinks.", "Mine is under the counter. I’ll actually drink it this time."], "miss": ["Thank you for telling me. I can fix that.", "You are being very nice about my experimental phase.", "It’s lovely that you made it, but I think the order got a little lost. Could we try again?", true], "retry": "We can stop fussing with it. Come and sit down when you get a chance."}, "evil": {"name": "Evil Vanessa", "role": "Self-appointed final boss", "art": "evil", "color": "#8c3957", "note": "Purple cape. Enormous entrance. Declared war on the loyalty card because it had no picture of her.", "aside": ["your counter would make an excellent throne. the height is wrong, but i could have someone kneel.", "You can have the stool. Both feet on the floor."], "miss": ["I refuse to give you a tragic origin story involving bad coffee.", "This is still a café. You can write a strongly worded complaint.", "a disappointing offering. remake it, and i may spare your tip jar.", true], "retry": "i shall record this slight in my extremely important book."}, "zoran": {"name": "Zoran", "role": "Tiny kitten, enormous demands", "art": "zoran", "color": "#9b815d", "note": "Cannot reach the floor from his chair. Still believes he owns the building. Water only; the coffee is not for kittens.", "aside": ["Zoran hooks a paw over the edge of Ella’s apron and gives it one sharp tug.", "You have a bowl, a chair and my complete attention. What else is in the contract?"], "miss": ["You are right. That bowl does not meet the very strict kitten standards.", "I accept your tiny, devastating review.", "Zoran sniffs the bowl, flicks his tail and shoves it away with both front paws.", false], "retry": "Zoran lifts his chin and turns his entire body away from the bowl."}, "kiia": {"name": "Kiia", "role": "Friend, finally off childcare duty", "art": "kiia", "color": "#a28768", "note": "Works taking care of children. Enjoyed choosing a drink without having to negotiate whose turn it was.", "aside": ["I’m enjoying not having to cut anybody else’s snack into smaller pieces.", "For the record, I can cut your receipt into a little triangle if you miss it."], "miss": ["You came here to stop answering questions. I can read my own ticket.", "At least neither of us has to explain this to a room full of children.", "That’s not quite it. Could I be the one getting looked after for a second and ask for another?", true], "retry": "That will do for tonight. You can have your break too."}, "jessica": {"name": "Jessica", "role": "Ella’s sister", "art": "jessica", "color": "#ad8091", "note": "Came to see how I was doing. Wanted an honest answer, but did not insist on getting one in front of a queue.", "aside": ["You don’t need to keep chatting to me if you’re concentrating. I can just sit here.", "I know. I like that you came, though."], "miss": ["Please do not use this as evidence that I cannot look after myself.", "The sister discount now includes a very personal apology.", "Wrong drink, Ella. I can wait if you want to do it again. You don’t have to rush for me.", true], "retry": "Leave it with me. I came to see you, remember?"}, "evelynn": {"name": "Evelynn", "role": "Agony’s Embrace", "art": "evelynn", "color": "#a04e9c", "note": "Says pleasant things as if she is testing where to put a knife. Told her that frightening the staff costs extra.", "aside": ["You keep your hands so steady. I wonder what it would take to change that.", "A broken milk jug. Please do not help."], "miss": ["If you say the word agony, I am charging for it.", "You may torment the feedback card. Leave the customers alone.", "Oh, darling. All that anticipation, and this is what you give me? Once more.", true], "retry": "The disappointment has its own flavour. I may savour that instead."}, "dominique": {"name": "Dominique", "role": "D.E.B.S. agent · Devon Aoki’s character", "art": "dominique", "color": "#777f99", "note": "Ordered without looking up, then watched the whole pour. I think that was a compliment. Hard to tell.", "aside": ["If anyone asks, I was never here.", "That will make collecting your loyalty stamps difficult."], "miss": ["I will try to make the next one more convincing.", "I am beginning to understand why your reports are so short.", "No. That’s not it. Try again.", true], "retry": "Enough. I have to go."}, "leon": {"name": "Leon Kennedy", "role": "Off duty, allegedly", "art": "leon", "color": "#74858e", "note": "Dry sense of humour. Polite about the coffee. Considerably harder to look at normally than I had planned.", "aside": ["I can wait. This is a pretty good place to have nothing happen.", "I can offer you at least forty seconds of that. No promises about the blender."], "miss": ["I promise the milk steamer is the only thing here under pressure.", "I am retiring the phrase precision pouring for the rest of the evening.", "Not quite what I ordered. Another attempt? Nobody’s grading your aim.", true], "retry": "Call it field testing. We can leave the report unfinished."}, "ada": {"name": "Ada Wong", "role": "Keeping her own counsel", "art": "ada", "color": "#9f5263", "note": "Has an answer for every comment Leon makes, and very few direct answers to anything else. Her order, at least, was straightforward.", "aside": ["You noticed more than you’re saying.", "Mostly that you took the chair with my coat on it."], "miss": ["I would appreciate one straightforward answer about what is wrong with it.", "No mystery left in this one. That is probably an improvement.", "Close. Not close enough. Show me the other version.", true], "retry": "An interesting result. Keep the receipt."}, "iris": {"name": "Iris", "role": "Florist from a few doors down", "art": "iris", "color": "#9b8f75", "note": "Practical about flowers. Lifted the vase out of the heat before she had even taken her coat off.", "aside": ["That little bunch will last longer if you change the water tomorrow. Don’t put sugar in it.", "Good. I was worried the flowers were about to develop a more complicated order than the customers."], "miss": ["That arrangement has too much syrup and no sense of proportion.", "I will leave the flower metaphors to you next time.", "A bit different from what I asked for. Could you rebalance it?", true], "retry": "I’ll keep this version. No need for a third arrangement."}, "robin": {"name": "Robin", "role": "Baker with flour on the cuffs", "art": "robin", "color": "#a38a71", "note": "Has strong opinions about burnt sugar and no patience for calling burnt pastry rustic. Brought something to eat.", "aside": ["I can hear you measuring from here. That’s reassuring. Our apprentice thinks a pinch is whatever fits in a fist.", "I would like to keep that apprentice away from the caramel."], "miss": ["Wrong batch. I can start another.", "We will agree never to sell this one as a seasonal special.", "The balance is off. No shame in a second batch, if you have time.", true], "retry": "We will stop at two batches. There is always tomorrow."}}, "nights": [{"title": "Keys to the café", "room": "Ella puts the evening key beside her phone. There is a message waiting from Vanessa. Her feet ache, and she is going to sit down before answering it.", "visits": [{"customer": "vanessa", "recipe": "brown-sugar-boba", "ella": "You’re early. I haven’t even turned the sign.", "hello": "i know. i wanted to see you do it. go on. i’ll pretend to be a normal customer afterwards.", "exchange": ["You have never pretended to be normal for me before.", "fine. i’ll be a difficult customer. you look cute in the apron, by the way.", "I am absolutely charging you full price.", "worth it. brown sugar boba. normal ice, pearls, and no pretending you’ve run out just because i want to watch you make it."], "after": "oh that’s good. i was prepared to be very annoying about this, but now my mouth is occupied.", "ellaAfter": "I have discovered the secret to good customer service.", "request": "Brown sugar boba, please. Tall glass, normal ice, stirred, with tapioca pearls."}, {"customer": "kiia", "recipe": "peach-tea", "ella": "Kiia! Finished for the day?", "hello": "Yes. Nobody needs their shoes found, their coat zipped or an explanation of why we cannot keep a worm in the fridge.", "exchange": ["Was that last one a real conversation?", "A very serious one. I need a drink I get to finish while it is still the temperature it started at.", "One iced peach tea. I’ll keep all fridge-related debates away from your table.", "Perfect. Also, look at you, running the place. I get to be the one watching you work for once."], "after": "Oh, that’s nice. I was about to stand up when somebody moved a chair. Apparently I’m still on duty in my head.", "ellaAfter": "Stay there. If anybody needs help with a coat, they can ask me.", "request": "Iced peach tea. Tall glass, a little ice, stirred. No topping."}, {"customer": "caprielle", "recipe": "pink-cloud", "ella": "What can I make you?", "hello": "The pink one looks lovely. But first, have you had anything yourself?", "exchange": ["I have made four drinks and taken one sip of water.", "That’s not the same thing, Ella. Have another sip. I can wait.", "You’re very firm for someone ordering whipped cream.", "I can be both things. A pink cloud, please. And then you can tell me whether you like the apron you picked."], "after": "That’s so good! The strawberry comes through first. Did you get your water?", "ellaAfter": "Yes. I am beginning to suspect you will check again."}, {"customer": "iris", "recipe": "strawberry-matcha", "ella": "I can move that vase if you need the space.", "hello": "Please do. It’s right under the warm air. The flowers will cook before I get my drink.", "exchange": ["I was trying to make the counter look welcoming.", "It does. Move them a handspan to the left and it will look welcoming tomorrow too.", "You make that sound very easy.", "Flowers are usually easier than customers. Something cool and fresh for me. A little sweetness, nothing heavy."], "after": "Yes, that’s the balance. I’ll leave these stems here. Use the short vase, not the tall one.", "ellaAfter": "I’ll take the professional advice. About the vase, anyway.", "flex": true, "flavour": {}, "temperature": "iced", "spectra": {"balance": [33, 77], "intensity": [11, 55], "body": [19, 63]}, "flavourRequest": "Cool · balanced · mellow · refreshing"}, {"customer": "zoran", "recipe": "house-water", "ella": "You are far too small to have pushed that door open.", "hello": "Zoran marches through the gap behind Iris, spots a chair and scrambles onto it with furious determination.", "exchange": ["That is a remarkable amount of attitude for someone who needed a lift.", "He plants one paw on the counter. When Ella looks away, he taps it again, harder.", "Water. In a bowl. Before you attempt a hostile takeover.", "Zoran squeaks at the empty bowl, then at Ella. The service is clearly unacceptable."], "after": "Zoran drinks, sneezes once and attacks a loose thread on the chair. The bowl has passed inspection.", "ellaAfter": "Excellent. Please leave the upholstery alive.", "request": "Ella fills a little bowl with two pours of cool water. No ice or topping.", "narrative": true}]}, {"title": "Unexpected company", "room": "Ella checks that the key is still in her pocket. It is. So is the spare receipt she printed for the table at the end. Tonight has raised several questions that can wait until after a shower.", "visits": [{"customer": "jessica", "recipe": "vanilla-oat", "ella": "You didn’t have to come all this way just to check on me.", "hello": "I wanted a drink. Checking on you is the convenient extra.", "exchange": ["You can ask how it’s going. I won’t break.", "How is it going, then? Not the answer you give customers.", "Busy. Sometimes fun. Sometimes I forget what I was reaching for.", "That sounds about right. I’ll have the vanilla oat latte. You can finish what you’re doing before you make mine."], "after": "That is really good. Also, I can see you looking at the queue. You don’t have to entertain me.", "ellaAfter": "I know. Stay a bit, though. I’ll come over when I can."}, {"customer": "dominique", "recipe": "long-night", "ella": "Hi. What can I get you?", "hello": "Coffee. Cold. Strong.", "exchange": ["That I can do. Is there a name for the order?", "Dominique.", "You looked as if you were deciding whether to give me a fake one.", "You looked as if you would notice. No sugar. A short glass is fine."], "after": "Good. Finally.", "ellaAfter": "I am choosing to take that as a compliment.", "request": "Strong iced black coffee. Short glass, normal ice, stirred, no topping."}, {"customer": "evelynn", "recipe": "midnight-mocha", "ella": "You’ve been looking at the menu for quite a while.", "hello": "I like the moment before someone gets what they want. They are so wonderfully easy to please.", "exchange": ["Here, that moment is usually when I find the whipped cream.", "And then you watch their face change. Perhaps we have more in common than you think.", "I would prefer a normal order to an ominous comparison.", "Warm. A little bitterness, something soft underneath. Make me want another taste."], "after": "Mm. You let the sweetness linger. How considerate of you.", "ellaAfter": "You may enjoy the drink. The person at the next table is not on the menu.", "flex": true, "flavour": {}, "temperature": "warm", "spectra": {"balance": [14, 58], "intensity": [40, 84], "body": [23, 67]}, "flavourRequest": "Warm · bitter · intense · refreshing"}, {"customer": "leon", "recipe": "long-night", "ella": "Welcome in. There are two seats free at the end.", "hello": "Thanks. Just coffee for me. I’m trying to keep tonight uncomplicated.", "exchange": [], "after": "Good coffee. No emergency attached. I could get used to this.", "ellaAfter": "One down. Ada, yours is next.", "party": "late-table", "partyPart": 0, "dialogue": [["ella", "Welcome in. There are two seats free at the end."], ["leon", "Thanks. Just coffee for me. I’m trying to keep tonight uncomplicated."], ["ada", "Then you should not have picked my table."], ["leon", "You were not sitting there when I came in."], ["ada", "I was saving it."], ["ella", "Right. Two customers, one table. You can debate who was here first after I take the orders."], ["leon", "Strong iced coffee. No sugar."], ["ada", "Peach tea for me. A little ice. Separate drinks, if you don’t mind."], ["ella", "Was there a chance I would put both in the same glass?"], ["leon", "I was hoping you were going to say no."]], "afterTalk": [["leon", "Good coffee. No emergency attached. I could get used to this."], ["ada", "Do try not to look so surprised by competent service."], ["ella", "One down. Ada, yours is next."]], "request": "Leon: strong iced black coffee. Short glass, normal ice, stirred, no topping."}, {"customer": "ada", "recipe": "peach-tea", "ella": "Peach tea, a little ice. Still correct?", "he icely. It is good to have somebody else watching the kettle for once.", "ellaAfter": "Your pastry is also very good. Even the corner that fell off.", "flex": true, "flavour": {}, "temperature": "warm", "spectra": {"balance": [33, 77], "intensity": [26, 70], "body": [0, 22]}, "flavourRequest": "Warm · balanced · mellow · refreshing"}, {"customer": "evil", "recipe": "midnight-mocha", "ella": "No. We are not having a boss fight in here.", "hello": "i have not even announced myself. this is discrimination against people with excellent capes.", "exchange": ["It’s touching the floor. Please move it away from the mop bucket.", "dark purple deserves better lighting than this. where is my throne?", "There is a stool. It is the same height as the other stools.", "then bring me something worthy of a final boss. coffee. chocolate. cream piled high enough to be seen from the doorway."], "after": "acceptable. i will permit the café to continue operating.", "ellaAfter": "Very generous. That will be full price. Evil does not qualify for the staff discount."}, {"customer": "caprielle", "recipe": "cocoa-cloud", "ella": "You remembered I was finishing tonight.", "hello": "Of course. Do you want me to stay while you close, or would you like some quiet?", "exchange": ["You can stay. You don’t have to find something to tidy.", "I wasn’t going to. I was going to sit down and order hot chocolate. With a ridiculous amount of cream.", "Now that sounds like a plan.", "And when you’re done, tell me one good thing from tonight. It can be very small."], "after": "The cream is touching my nose. This is a practical problem, not a complaint.", "ellaAfter": "One good thing: you asked whether I wanted company, and then actually sat down."}, {"customer": "iris", "recipe": "strawberry-matcha", "ella": "The flowers survived. All of them.", "hello": "I saw. You even changed the water. I am dangerously close to leaving you something more expensive.", "exchange": ["Let’s not test me with an orchid yet.", " nt to do the next one."], "answers": ["Please do not give the kitten the till code. Good work tonight.", "Good. I’ll leave the next set of keys where you found these. Rest first."]}, {"incoming": "The florist said you moved the flowers away from the heater. Thank you. Did everything else stay in one piece?", "choices": ["Mostly. Two customers held an interrogation over peach tea.", "The cream survived. I consider that a win."], "answers": ["As long as they paid. If anyone asks for security footage, send them to me.", "Then I’ll order another carton. You have enough to do without rationing it."]}, {"incoming": "Three evening shifts done. Thank you, Ella. The extra nights are yours if you want them, but you do not owe me an answer tonight.", "choices": ["I’ll decide after I have had a day off.", "I would like to come back. On my terms, though."], "answers": ["Correct answer. I’ll keep the rota blank until you tell me.", "Also a correct answer. Tell me the hours you want and we’ll work around them."]}, {"incoming": "Thanks for taking an extra shift. The baker dropped off a bag for the staff. Please count yourself as staff before Zoran gets any ideas.", "choices": ["I ate one. It was excellent.", "Does the kitten receive performance reviews?"], "answers": ["Good. That was the intended outcome. See you next time.", "Yes. Poor timekeeping, strong leadership skills, no respect for boundaries."]}, {"incoming": "I found your spare teaspoons. They were in the clean-mug cupboard. No idea how. Thanks for tonight; you can leave the rest for me.", "choices": ["I may also have taken a cloth home.", "I am officially finished for the night."], "answers": ["Keep it until next time. We are not running a cloth amnesty tonight.", "Good. Go and enjoy being somewhere that nobody hands you an order ticket."]}], "keepsakes": [{"id": "coaster", "name": "First evening receipt", "icon": "receipt", "from": "Vanessa", "text": "The first paid order. Under the total: “excellent service. bartender const n=data.nights[night],base='nights.'+night;html='<div class="section-head"><div><span class="eyebrow">'+(night<3?'MAIN STORY':'OPTIONAL BONUS')+'</span><h2>'+esc(n.title)+'</h2><p>'+n.visits.length+' drink orders. Read top to bottom in the order Ella plays it.</p></div><button data-action="add-visit">'+icon('plus')+'Add order</button></div><section class="card">'+field('Evening title',base+'.title')+'</section>';
n.visits.forEach((v,i)=>{const b=base+'.visits.'+i,p=data.cast[v.customer];html+='<section class="card" data-visit="'+i+'"><div class="card-head"><div>'+(p&&media.art[p.art]?'<img src="'+media.art[p.art]+'" alt="">':'')+'<h3>Order '+(i+1)+' · '+esc(p?.name||v.customer)+'</h3></div>'+tools(base+'.visits',i,n.visits.length)+'</div><div class="two">'+select('Customer',b+'.customer',castOptions())+select('Drink / recipe',b+'.recipe',media.recipes.map(r=>[r.id,r.name]))+'</div>'+lines('1 · Arrival & conversation',b+'.dialogue')+'<details class="branch"><summary>2 · Optional chat while making this drink</summary><p class="hint">This character’s counter chat is shared across their visits.</p>'+field(p?.name+' / narrator', 'cast.'+v.customer+'.aside.0',{type:'area'})+field('Ella', 'cast.'+v.customer+'.aside.1',{type:'area'})+'</details>'+lines('3 · Serve drink — successful result',b+'.afterTalk')+'<details class="branch"><summary>Alternative · The drink is wrong</summary>'+field('Customer’s reaction','cast.'+v.customer+'.miss.2',{type:'area'})+field('Ella’s reply','cast.'+v.customer+'.miss.0',{type:'area'})+select('Offer one remake?','cast.'+v.customer+'.miss.3',[['false','No'],['true','Yes']])+field('Customer after a second miss','cast.'+v.customer+'.retry',{type:'area'})+field('Ella after a second miss','cast.'+v.customer+'.miss.1',{type:'area'})+'</details>'+'<details class="metadata"><summary>Order settings & shared-table link</summary><p class="hint">Shared tables use two consecutive orders with the same group ID, numbered first and second. The current game pairs Leon and Ada.</p><div class="two">'+select('Request style',b+'.flex',[['false','Named recipe'],['true','Flexible flavour request']])+field('Written order override (optional)',b+'.request',{type:'area'})+'</div><div class="two">'+field('Shared-table group ID (optional)',b+'.party')+select('Position at shared table',b+'.partyPart',[['','Not grouped'],[0,'First drink'],[1,'Second drink']],true)+'</div>'+select('Customer narration',b+'.narrative',[['false','Character speaks'],['true','Narration, e.g. Zoran']])+field('Ella’s wrong-order response override (optional)',b+'.ellaMiss',{type:'area'})+'</details></section>';});
html+='<section class="card afterhours"><span class="eyebrow">AFTER THE FINAL CUSTOMER</span><h2>Home & after hours</h2>'+field('Ella gets home — narration',base+'.room',{type:'area'})+'<div class="subhead"><h3>Phone · Vanessa</h3></div>'+field('Vanessa’s message','phone.'+night+'.incoming',{type:'area'})+'<div class="two">'+[0,1].map(j=>'<div>'+field('Ella’s reply '+(j+1),'phone.'+night+'.choices.'+j,{type:'area'})+field('Vanessa’s answer','phone.'+night+'.answers.'+j,{type:'area'})+'</div>').join('')+'</div><div class="subhead"><h3>Phone · Mina</h3></div>'+field('Mina’s message','boss.'+night+'.incoming',{type:'area'})+'<div class="two">'+[0,1].map(j=>'<div>'+field('Ella’s reply '+(j+1),'boss.'+night+'.choices.'+j,{type:'area'})+field('Mina’s answer','boss.'+night+'.answers.'+j,{type:'area'})+'</div>').join('')+'</div><div class="subhead"><h3>That evening’s keepsake</h3></div>'+field('Item name','keepsakes.'+night+'.name')+field('From','keepsakes.'+night+'.from')+field('Description','keepsakes.'+night+'.text',{type:'area'})+'</section>';
}else if(section==='cast'){
if(!data.cast[castId])castId=Object.keys(data.cast)[0];const b='cast.'+castId;html='<div class="section-head"><div><h2>Characters & reactions</h2><p>These notes and reactions are shared across that character’s visits.</p></div></div><div class="cast-grid">'+castOptions().map(([id,n])=>'<button data-cast="'+id+'" class="'+(id===castId?'active':'')+'">'+esc(n)+'</button>').join('')+'</div><section class="card"><div class="two">'+field('Display name',b+'.name')+field('Role shown in the notebook',b+'.role')+'</div><div class="three">'+field('Stable character ID',b+'.id',{readonly:true})+field('Speaker colour',b+'.color',{type:'color'})+field('Artwork key',b+'.art',{readonly:true})+'</div>'+field('Ella’s notebook description',b+'.note',{type:'area',large:true})+'<div class="subhead"><h3>Optional chat while mixing</h3></div>'+field('Customer / narrator line',b+'.aside.0',{type:'area'})+field('Ella’s response',b+'.aside.1',{type:'area'})+'<div class="subhead"><h3>Wrong-order reactions</h3></div>'+field('Customer’s first reaction',b+'.miss.2',{type:'area'})+field('Ella’s first apology / reply',b+'.miss.0',{type:'area'})+select('Offer one remake?',b+'.miss.3',[['false','No'],['true','Yes']])+field('Customer’s reaction after a second miss',b+'.retry',{type:'area'})+field('Ella’s reply after the second attempt',b+'.miss.1',{type:'area'})+'<p class="hint">Character IDs and artwork keys stay fixed so existing game references continue to work.</p></section>';
}else if(section==='phone'||section==='boss'){
const root=section==='phone'?'phone':'boss';html='<div class="section-head"><div><h2>'+ (root==='phone'?'Vanessa’s texts':'Mina’s texts')+'</h2><p>One conversation per evening, with two player replies and two corresponding answers.</p></div></div>';data[root].forEach((m,i)=>{const b=root+'.'+i;html+='<section class="card"><h3>'+(i<3?'Evening '+(i+1):'Bonus '+(i-2))+'</h3>'+field('Incoming message',b+'.incoming',{type:'area'})+'<div class="two">'+[0,1].map(j=>'<div>'+field('Ella’s reply '+(j+1),b+'.choices.'+j,{type:'area'})+field('Answer to reply '+(j+1),b+'.answers.'+j,{type:'area'})+'</div>').join('')+'</div></section>';});
}else{html='<div class="section-head"><div><h2>Keepsakes</h2><p>One item per completed evening. IDs stay fixed to preserve the shelf.</p></div></div>';data.keepsakes.forEach((k,i)=>{const b='keepsakes.'+i;html+='<section class="card"><h3>'+(i<3?'Evening '+(i+1):'Bonus '+(i-2))+'</h3><div class="two">'+field('Item name',b+'.name')+field('From',b+'.from')+'</div>'+field('Description',b+'.text',{type:'area'})+select('Icon',b+'.icon',[['receipt','Receipt'],['star','Star'],['book','Book'],['moon','Moon'],['coffee','Cup'],['bow','Ribbon']])+'</section>';});}
$('editor').innerHTML=html;const idInput=document.querySelector('[data-path="cast.'+castId+'.id"]');if(idInput)idInput.value=castId;updateIssues();}
function validate(d=data){const errors=[],warnings=[];if(!d||!d.cast||!Array.isArray(d.nights)||d.nights.length!==5||!Array.isArray(d.phone)||!Array.isArray(d.boss)||!Array.isArray(d.keepsakes))return {errors:['This file is not a complete Two Drinks story export.'],warnings};for(const root of ['phone','boss']){if(d[root].length!==5)errors.push(root+': expected five conversations.');d[root].forEach((m,i)=>{if(!m||!Array.isArray(m.choices)||!Array.isArray(m.answers)||m.choices.length!==2||m.answers.length!==2)errors.push(root+' '+(i+1)+': two replies and answers are required.');});}if(d.keepsakes.length!==5)errors.push('Five keepsakes are required.');for(const [id,p]of Object.entries(d.cast)){if(!Array.isArray(p.aside)||p.aside.length!==2||!Array.isArray(p.miss)||p.miss.length!==4)errors.push(id+': missing character reactions.');}d.nights.forEach((n,ni)=>{if(!Array.isArray(n.visits)||!n.visits.length){errors.push('Evening '+(ni+1)+' needs an order.');return;}n.visits.forEach((v,vi)=>{const where='Evening '+(ni+1)+', order '+(vi+1);if(!d.cast[v.customer])errors.push(where+': unknown customer.');if(!media.recipes.some(r=>r.id===v.recipe))errors.push(where+': unknown recipe.');for(const key of ['dialogue','afterTalk']){const lines=v[key];if(!Array.isArray(lines)||!lines.length){errors.push(where+': '+key+' has no dialogue.');continue;}for(const line of lines)if(!Array.isArray(line)||line.length!==2||!['ella','narrator',...Object.keys(d.cast)].includes(line[0])||typeof line[1]!=='string'||!line[1].trim()){errors.push(where+': an invalid or blank '+key+' line.');break;}}if(v.party){const other=n.visits[vi+(v.partyPart===0?1:-1)];if(![0,1].includes(v.partyPart)||other?.party!==v.party||other?.partyPart===v.partyPart)errors.push(where+': shared-table orders must stay together, first then second.');if(!['leon','ada'].includes(v.customer))errors.push(where+': shared-table artwork currently supports Leon and Ada.');}});});if(d.nights[0]?.visits[0]?.customer!=='vanessa')warnings.push('Vanessa no longer opens the main story.');if(d.nights[2]?.visits.at(-1)?.customer!=='vanessa')warnings.push('Vanessa no longer closes the main story.');return {errors:[...new Set(errors)],warnings};}
function updateIssues(){const v=validate();$('issue-count').textContent=v.errors.length?'('+v.errors.length+' issues)':v.warnings.length?'('+v.warnings.length+' notes)':'✓';}
function syncLegacy(){for(const n of data.nights)for(const v of n.visits){v.ella=v.dialogue.find(l=>l[0]==='ella')?.[1]||'What can I make you?';v.hello=v.dialogue.find(l=>l[0]!=='ella')?.[1]||v.dialogue[0]?.[1]||'';v.after=v.afterTalk.find(l=>l[0]!=='ella')?.[1]||v.afterTalk[0]?.[1]||'';v.ellaAfter=v.afterTalk.find(l=>l[0]==='ella')?.[1]||'';v.exchange=[];if(!v.party){delete v.party;delete v.partyPart;}if(!v.request)delete v.request;if(!v.ellaMiss)delete v.ellaMiss;}}
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.hidden=true;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);}
function notice(title,copy,fn=null){$('notice-title').textContent=title;$('notice-copy').textContent=copy;$('notice-confirm').textContent=fn?'Remove':'Close';$('notice').querySelector('[data-action="cancel-notice"]').hidden=!fn;pending=fn;$('notice').showModal();}
function safeExport(kind){syncLegacy();const v=validate();if(v.errors.length){notice('Fix these before exporting',v.errors.join('\n'));return;}if(kind==='export')download('TWO-DRINKS-STORY-EDITS.json',JSON.stringify({format:'two-drinks-story',version:1,exportedAt:new Date().toISOString(),data},null,2),'application/json');if(kind==='js')download('story-data.js','(function(root){const data='+JSON.stringify(data,null,2)+';root.CafeStory=data;if(typeof module!=="undefined"&&module.exports)module.exports=data;})(typeof window==="undefined"?globalThis:window);\n','text/javascript');if(kind==='portable'){const root=document.documentElement.cloneNode(true);root.querySelector('#editor-seed').textContent=JSON.stringify(data).replace(/</g,'\\u003c');root.querySelectorAll('dialog[open]').forEach(d=>d.removeAttribute('open'));download('TWO-DRINKS-SCRIPT-EDITOR.html','<!doctype html>\n'+root.outerHTML,'text/html');}toast('Export saved. Send the file back when you want it applied.');}
function showPreview(path,i=0){previewLines=clone(get(path));previewIndex=i;const bits=path.split('.');previewVisit=bits[0]==='nights'?data.nights[+bits[1]].visits[+bits[3]]:null;$('preview-scene').textContent=bits.at(-1)==='afterTalk'?'AFTER A SUCCESSFUL DRINK':'CONVERSATION';drawPreview();$('preview').showModal();}
function drawPreview(){const [who,text]=previewLines[previewIndex];$('preview-speaker').textContent=name(who);$('preview-speaker').style.background=who==='ella'?'#78968e':data.cast[who]?.color||'#8f8490';$('preview-copy').textContent=text;$('preview-count').textContent=(previewIndex+1)+' / '+previewLines.length;const ids=previewVisit?.party?['leon','ada']:[previewVisit?.customer||who];$('preview-portraits').innerHTML=ids.filter(id=>data.cast[id]&&media.art[data.cast[id].art]).map(id=>'<img class="'+(id===who?'speaking':'')+'" src="'+media.art[data.cast[id].art]+'" alt="'+esc(name(id))+'">').join('');$('preview').querySelector('[data-action="prev-preview"]').disabled=previewIndex===0;$('preview').querySelector('[data-action="next-preview"]').disabled=previewIndex===previewLines.length-1;}
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset.path||el.readOnly)return;let value=el.value;const old=get(el.dataset.path);if(typeof old==='boolean'||el.dataset.path.endsWith('.flex')||el.dataset.path.endsWith('.narrative')||el.dataset.path.endsWith('.miss.3'))value=value==='true';if(el.hasAttribute('data-number'))value=value===''?undefined:Number(value);put(el.dataset.path,value);persist();});
document.addEventListener('change',e=>{if(e.target.dataset.path&&(e.target.dataset.path.endsWith('.customer')||e.target.dataset.path.endsWith('.name')))render();});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.section){section=b.dataset.section;if(b.dataset.night)night=Number(b.dataset.night);render();return;}if(b.dataset.cast){castId=b.dataset.cast;render();return;}const a=b.dataset.action,path=b.dataset.pathRef,i=Number(b.dataset.index);if(['up','down','copy','trash'].includes(a)){const list=get(path);const apply=()=>{if(a==='up')[list[i-1],list[i]]=[list[i],list[i-1]];if(a==='down')[list[i+1],list[i]]=[list[i],list[i+1]];if(a==='copy')list.splice(i+1,0,clone(list[i]));if(a==='trash')list.splice(i,1);persist();render();};if(a==='trash')notice('Remove this '+(path.endsWith('visits')?'order':'line')+'?','This removes it from the editor draft. Your exported files are unchanged.',apply);else apply();return;}if(a==='add-line'){get(path).push(['ella','']);persist();render();return;}if(a==='add-visit'){data.nights[night].visits.push({customer:'vanessa',recipe:'brown-sugar-boba',ella:'',hello:'',exchange:[],after:'',ellaAfter:'',dialogue:[['ella','']],afterTalk:[['vanessa',''],['ella','']]});persist();render();return;}if(a==='preview'||a==='line-preview'){showPreview(path,a==='line-preview'?i:0);return;}if(a==='prev-preview'){previewIndex--;drawPreview();return;}if(a==='next-preview'){previewIndex++;drawPreview();return;}if(a==='close-preview'){$('preview').close();return;}if(a==='cancel-notice'){$('notice').close();pending=null;return;}if(a==='validate'){const v=validate();notice(v.errors.length?'Script needs attention':'Script checks passed',[...v.errors,...v.warnings].join('\n')||'Dialogue speakers, recipes, paired orders, phone replies and required data are valid.');return;}if(a==='import'){$('import-file').click();return;}if(['export','js','portable'].includes(a))safeExport(a);});
$('notice-confirm').onclick=()=>{const fn=pending;pending=null;$('notice').close();if(fn)fn();};
$('import-file').onchange=async()=>{const file=$('import-file').files[0];if(!file)return;try{const parsed=JSON.parse(await file.text()),candidate=parsed.data||parsed;const structural=validate(candidate);if(!candidate.cast||!Array.isArray(candidate.nights)||candidate.nights.length!==5)throw Error('Choose a complete Two Drinks story JSON export.');if(structural.errors.length)throw Error(structural.errors.join('\n'));data=clone(candidate);normalise();night=0;section='night';persist();render();toast('Story imported. Your draft is now using this file.');}catch(err){notice('Could not import',String(err.message||err));}$('import-file').value='';};
render();
})();</script></body></html>
